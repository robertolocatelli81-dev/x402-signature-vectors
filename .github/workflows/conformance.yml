name: conformance

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # lunedì mattina: i vettori non devono marcire in silenzio

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      # Nessuna installazione: la suite gira sulla sola stdlib, ed è metà del punto.
      - name: Integrity gate (fail-closed)
        run: python3 tools/check_manifest.py
      - name: Integrity gate inside a git worktree (a .git FILE is not a suite file; a planted file still fails)
        run: python3 tools/test_check_manifest.py
      - name: Vector schema
        run: python3 tools/check_schema.py
      - name: SPEC.md covers every schema field, and nothing else (closed list of reject classes)
        run: python3 tools/check_spec.py
      - name: Prose numbers match the data (README counts, per-vector notes, changelog entry)
        run: python3 tools/check_docs.py
      - name: Conformance run
        run: python3 verify.py
      - name: Real-payment vectors rebuild byte-identical from audit/onchain_sources.json (offline)
        run: python3 tools/genera_vettori_onchain.py --confronta
      - name: runner compares class, address and verdict (wrong expectations planted, each must fail)
        run: python3 tools/test_runner_compares.py
      - name: runner closed schema (planted fields named, intact suite green)
        run: python3 tools/test_runner_schema.py
      - name: Audit of the specification examples (recomputed; must equal audit/spec_examples_audit.json)
        run: python3 tools/audit_spec_examples.py
      - name: Fuzz the runner (no unhandled exceptions on hostile input)
        run: python3 tools/fuzz_runner.py
      - name: Positive control of the point-at-infinity vectors (a defective recovery must ACCEPT them)
        run: python3 tools/discriminate_infinity.py

  positive-control:
    # 18 sabotages of lib/, verify.py and the runner, one per fresh copy: every one must be caught by a gate above
    # and change behaviour on a batch that is not the vectors (audit/POSITIVE_CONTROL.md). About 30 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python3 tools/positive_control.py

  crossvalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      # Le librerie di riferimento servono SOLO qui: dimostrano che lib/ non ha un punto cieco
      # proprio. La suite non dipende da loro.
      - run: pip install coincurve "eth-hash[pycryptodome]" eth-account
      - name: Cross-validate primitives against libsecp256k1 and eth-hash
        run: python3 tools/crossvalidate.py
      - name: Cross-validate EIP-712 encoding against eth-account
        run: python3 tools/crossvalidate_eip712.py

  sdk:
    # The vectors through two official x402 SDKs, pinned: npm @x402/evm 2.31.0 (package-lock.json, integrity hashes)
    # and PyPI x402 2.28.0 (requirements.txt). Off-chain only; see audit/SDK_RESULTS.md and SPEC.md §5.
    runs-on: ubuntu-latest
    env:
      X402_TS_ENV: tools/adapters/typescript
      X402_PY: ${{ runner.temp }}/x402py/bin/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/adapters/typescript
      - run: python3 -m venv "$RUNNER_TEMP/x402py" && "$RUNNER_TEMP/x402py/bin/pip" install -r tools/adapters/python/requirements.txt
      - name: Adapters answer every vector (known answers, closed lines)
        run: python3 tools/test_sdk_adapters.py
      - name: SDK results equal audit/sdk_results.json, every divergence classified
        run: python3 tools/run_sdk_adapters.py
